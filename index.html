<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #d90429; --success: #2b9348; --gray: #6c757d; --bg-color: #f0f2f5; --star: #ffb703;
        }

        /* ডেস্কটপ এবং মোবাইল দুটিতেই ঠিকঠাক কাজ করার জন্য ফিক্স */
        body {
            background-color: var(--bg-color); font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex; flex-direction: column; align-items: center; 
            padding: 15px; padding-bottom: 80px; margin: 0;
            overflow-x: hidden; /* ডাইনে-বামে নড়া বন্ধ */
        }

        /* অনলাইন/অফলাইন কাউন্টার বক্স (আপনার চাহিদামতো ৩টা বক্স) */
        .stats-container {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; 
            width: 100%; max-width: 450px; margin-bottom: 15px;
        }
        .stat-box {
            background: white; padding: 12px 5px; border-radius: 8px; 
            text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .stat-box b { display: block; font-size: 18px; color: var(--primary); margin-bottom: 3px; }
        .stat-box span { font-size: 11px; color: var(--gray); font-weight: bold; }

        /* ফিল্টার বাটন ডিজাইন - আপনার ডিজাইনের সাথে ম্যাচিং */
        .filter-container { display: flex; gap: 10px; width: 100%; max-width: 450px; margin-bottom: 15px; }
        .filter-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; background: white; color: var(--gray); font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .filter-btn.active { background: var(--primary); color: white; }

        /* আপনার অরিজিনাল রেজিস্ট্রেশন ফর্ম */
        #regPage {
            background: white; width: 100%; max-width: 450px; padding: 20px; box-sizing: border-box;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px;
        }
        .reg-title { text-align: center; color: var(--primary); margin-bottom: 15px; font-size: 18px; font-weight: bold; }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .input-group { margin-bottom: 10px; }
        .input-group.full { grid-column: 1 / 3; }
        .input-group label { font-size: 11px; font-weight: bold; color: var(--gray); display: block; margin-bottom: 3px; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 13px; outline: none; }
        
        #donorList { width: 100%; max-width: 450px; }

        /* আপনার অরিজিনাল ডোনার কার্ড */
        .donor-card {
            background: white; width: 100%; border-radius: 12px; box-sizing: border-box;
            padding: 16px; box-shadow: 0 2px 15px rgba(0,0,0,0.08); border: 1px solid #eef0f2;
            margin-bottom: 15px; position: relative; animation: slideUp 0.4s ease-out;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .fav-heart { position: absolute; top: 15px; right: 80px; font-size: 18px; color: #ddd; cursor: pointer; transition: 0.3s; }
        .fav-heart.active { color: var(--primary); transform: scale(1.2); }

        .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .profile-part { display: flex; gap: 12px; }
        .avatar { width: 55px; height: 55px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover; }
        .name-area h3 { margin: 0; font-size: 16px; color: #2b2d42; display: flex; align-items: center; gap: 5px; }
        
        .social-row { display: flex; gap: 12px; margin-top: 6px; }
        .social-row a { font-size: 18px; text-decoration: none; }
        .fa-facebook { color: #1877F2; } .fa-whatsapp { color: #25D366; }

        .blood-group-badge { background: var(--primary); color: white; padding: 5px 10px; border-radius: 8px; font-weight: bold; font-size: 14px; text-align: center; }
        
        .availability-tag { display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: 600; margin: 8px 0; }
        .status-yes { background: #e9f5ec; color: var(--success); }
        .status-no { background: #fee2e2; color: #dc2626; }
        
        .extra-info { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; background: #fff5f5; padding: 10px; border-radius: 8px; border: 1px dashed var(--primary); }
        .stats-row { display: flex; gap: 15px; font-size: 11px; color: var(--gray); background: #f8f9fa; padding: 8px; border-radius: 8px; margin: 12px 0; }
        
        .review-section { border-top: 1px solid #eee; padding-top: 10px; margin-bottom: 12px; text-align: center; }
        .star-box { display: flex; justify-content: center; gap: 5px; color: #ddd; font-size: 18px; cursor: pointer; }
        .star-box .active { color: var(--star); }

        .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { border: none; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
        .btn-follow { background: #eef2ff; color: #4338ca; }
        .btn-follow.active { background: #4338ca; color: white; }
        .btn-call { background: var(--primary); color: white; }
        .btn-del-card { background: #333; color: white; grid-column: 1 / 3; margin-top: 5px; }

        /* বটম নেভ ডেস্কটপেও মাঝখানে থাকবে */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; margin: 0 auto; width: 100%; max-width: 450px; background: white; display: flex; justify-content: space-around; padding: 12px; border-top: 1px solid #ddd; z-index: 100; }
        .nav-item { border: none; background: none; color: var(--gray); font-size: 20px; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

    <div class="stats-container" id="statsArea" style="display: none;">
        <div class="stat-box">
            <b id="countTotal">0</b>
            <span>মোট ডোনার</span>
        </div>
        <div class="stat-box">
            <b id="countOnline" style="color: var(--success);">0</b>
            <span>অনলাইন (অ্যাক্টিভ)</span>
        </div>
        <div class="stat-box">
            <b id="countOffline" style="color: #dc2626;">0</b>
            <span>অফলাইন</span>
        </div>
    </div>

    <div class="filter-container" id="filterTabs" style="display: none;">
        <button class="filter-btn active" onclick="setFilter('হ্যাঁ', this)">সক্রিয় লিস্ট</button>
        <button class="filter-btn" onclick="setFilter('না', this)">অফলাইন লিস্ট</button>
        <button class="filter-btn" onclick="setFilter('fav', this)">ফেভারিট</button>
    </div>

    <div id="regPage">
        <div class="reg-title" id="formTitle"><i class="fas fa-id-card"></i> ডোনার প্রোফাইল সেটআপ</div>
        <div class="input-grid">
            <div class="input-group full"><label><i class="fas fa-user"></i> নাম</label><input type="text" id="inName" placeholder="আপনার নাম"></div>
            <div class="input-group"><label><i class="fas fa-tint"></i> রক্তের গ্রুপ</label><input type="text" id="inBlood" placeholder="A+"></div>
            <div class="input-group"><label><i class="fas fa-notes-medical"></i> টাইপ</label><input type="text" id="inType" placeholder="Positive"></div>
            <div class="input-group full"><label><i class="fas fa-map-marker-alt"></i> ঠিকানা</label><input type="text" id="inLoc" placeholder="ঠিকানা"></div>
            <div class="input-group"><label><i class="fas fa-phone-alt"></i> ফোন নম্বর</label><input type="tel" id="inPhone" placeholder="017..."></div>
            <div class="input-group"><label><i class="fas fa-weight"></i> ওজন</label><input type="text" id="inWeight" placeholder="৭০ কেজি"></div>
            <div class="input-group"><label><i class="fas fa-calendar-alt"></i> শেষ রক্তদান</label><input type="text" id="inLast" placeholder="২ মাস আগে"></div>
            <div class="input-group"><label><i class="fas fa-hand-holding-heart"></i> মোট দান</label><input type="text" id="inTimes" placeholder="০৪ বার"></div>
            
            <div class="input-group full">
                <label><i class="fas fa-clock"></i> আপনি কি এখন রক্ত দিতে পারবেন?</label>
                <select id="inCanDonate">
                    <option value="হ্যাঁ">হ্যাঁ (অনলাইন/প্রস্তুত)</option>
                    <option value="না">না (অফলাইন/অসুস্থ)</option>
                </select>
            </div>

            <div class="input-group"><label><i class="fab fa-facebook"></i> ফেসবুক লিঙ্ক</label><input type="text" id="inFb"></div>
            <div class="input-group"><label><i class="fab fa-whatsapp"></i> হোয়াটসঅ্যাপ নম্বর</label><input type="text" id="inWa"></div>
            <div class="input-group full"><label><i class="fas fa-info-circle"></i> বায়ো/বিবরণ</label><textarea id="inBio" rows="2"></textarea></div>
        </div>
        <div id="btnArea">
            <button onclick="saveToOnline()" id="saveBtn" style="width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px;"><i class="fas fa-upload"></i> পোস্ট আপডেট করুন</button>
        </div>
    </div>

    <div id="donorList" style="display:none;"></div>

    <div class="bottom-nav">
        <button id="navHome" class="nav-item" onclick="showFeed()"><i class="fas fa-home"></i></button>
        <button id="navReg" class="nav-item active" onclick="showReg()"><i class="fas fa-user-edit"></i></button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBrWesq_t5fvUPcCfwKDdpIjBaHumhQg-g",
            databaseURL: "https://blood-donor-online-default-rtdb.firebaseio.com",
            projectId: "blood-donor-online",
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let myKey = localStorage.getItem('myDonorKey');
        let currentFilter = 'হ্যাঁ';
        let favList = JSON.parse(localStorage.getItem('myFavDonors')) || [];

        function saveToOnline() {
            const data = {
                name: document.getElementById('inName').value,
                blood: document.getElementById('inBlood').value,
                type: document.getElementById('inType').value,
                loc: document.getElementById('inLoc').value,
                phone: document.getElementById('inPhone').value,
                weight: document.getElementById('inWeight').value,
                last: document.getElementById('inLast').value,
                times: document.getElementById('inTimes').value,
                canDonate: document.getElementById('inCanDonate').value,
                bio: document.getElementById('inBio').value,
                fb: document.getElementById('inFb').value,
                wa: document.getElementById('inWa').value,
                rating: 80,
                followers: 2
            };
            if(!data.name || !data.phone) { alert("নাম ও ফোন নম্বর দিন!"); return; }
            const ref = myKey ? database.ref('donors/' + myKey) : database.ref('donors/').push();
            ref.set(data).then(() => {
                localStorage.setItem('myDonorKey', ref.key);
                myKey = ref.key;
                alert("সফলভাবে আপডেট হয়েছে!"); showFeed();
            });
        }

        function loadDonors() {
            database.ref('donors/').on('value', (snapshot) => {
                const list = document.getElementById('donorList');
                list.innerHTML = ""; 
                
                let totalDonors = 0;
                let onlineDonors = 0;
                let offlineDonors = 0;

                snapshot.forEach((child) => {
                    const data = child.val();
                    const key = child.key;

                    // কাউন্টার গোনা হচ্ছে
                    totalDonors++;
                    if(data.canDonate === "হ্যাঁ") {
                        onlineDonors++;
                    } else {
                        offlineDonors++;
                    }

                    // লিস্ট ফিল্টারিং
                    if(currentFilter === 'fav') {
                        if(!favList.includes(key)) return;
                    } else if(data.canDonate !== currentFilter) return;

                    const statusClass = (data.canDonate === "হ্যাঁ") ? "status-yes" : "status-no";
                    const statusText = (data.canDonate === "হ্যাঁ") ? "● এখন রক্ত দিতে পারবেন" : "○ এখন রক্ত দিতে পারবেন না";
                    const isFav = favList.includes(key) ? 'active' : '';

                    list.innerHTML += `
                        <div class="donor-card">
                            <i class="fas fa-heart fav-heart ${isFav}" onclick="toggleFav('${key}')"></i>
                            <div class="card-top">
                                <div class="profile-part">
                                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${data.phone}" class="avatar">
                                    <div class="name-area">
                                        <h3>${data.name} <i class="fas fa-check-circle" style="color:#1da1f2;"></i></h3>
                                        <div style="font-size: 11px; color: var(--gray);"><i class="fas fa-map-marker-alt"></i> ${data.loc}</div>
                                        <div class="social-row">
                                            <a href="${data.fb || '#'}" target="_blank"><i class="fab fa-facebook"></i></a>
                                            <a href="https://wa.me/${data.wa}" target="_blank"><i class="fab fa-whatsapp"></i></a>
                                        </div>
                                    </div>
                                </div>
                                <div class="blood-group-badge">${data.blood}<br><span style="font-size: 9px;">${data.type}</span></div>
                            </div>
                            <div class="card-body">
                                <span class="availability-tag ${statusClass}">${statusText}</span>
                                <div class="extra-info">
                                    <div>📍 ${data.loc}</div><div>⚖️ ${data.weight}</div>
                                    <div>📞 ${data.phone}</div><div>📅 দান: ${data.times}</div>
                                </div>
                                <p style="font-size: 13px; color: #4a4a4a; margin: 8px 0; word-wrap: break-word;">${data.bio || 'জরুরি প্রয়োজনে রক্ত দান করুন।'}</p>
                            </div>
                            <div class="stats-row">
                                <div><b>${data.followers || 0}</b> ফলোয়ার</div>
                                <div><b>${data.times}</b> রক্ত দান</div>
                                <div><b>রেটিং ${data.rating || 80}%</b></div>
                            </div>
                            <div class="review-section">
                                <div class="star-box" onclick="giveRating('${key}')">
                                    <i class="fas fa-star active"></i><i class="fas fa-star active"></i><i class="fas fa-star active"></i><i class="fas fa-star active"></i><i class="fas fa-star"></i>
                                </div>
                                <div style="font-size: 10px; color: var(--gray); margin-top: 5px;">স্টার দিয়ে রিভিউ দিন</div>
                            </div>
                            <div class="card-actions">
                                <button class="btn btn-follow" id="fBtn-${key}" onclick="follow('${key}')"><i class="fas fa-heart"></i> ফলো</button>
                                <a href="tel:${data.phone}" class="btn btn-call"><i class="fas fa-phone-alt"></i> কল করুন</a>
                                <button class="btn btn-del-card" onclick="deletePost('${key}')"><i class="fas fa-trash-alt"></i> ডিলিট করুন</button>
                            </div>
                        </div>`;
                });

                // বক্সে সংখ্যাগুলো বসানো হচ্ছে
                document.getElementById('countTotal').innerText = totalDonors;
                document.getElementById('countOnline').innerText = onlineDonors;
                document.getElementById('countOffline').innerText = offlineDonors;
            });
        }

        function setFilter(val, btn) {
            currentFilter = val;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadDonors();
        }

        function toggleFav(key) {
            if(favList.includes(key)) favList = favList.filter(id => id !== key);
            else favList.push(key);
            localStorage.setItem('myFavDonors', JSON.stringify(favList));
            loadDonors();
        }

        function follow(key) {
            database.ref('donors/' + key + '/followers').transaction(c => (c || 0) + 1);
            document.getElementById('fBtn-'+key).innerText = "Following";
            document.getElementById('fBtn-'+key).classList.add('active');
        }

        function giveRating(key) {
            database.ref('donors/' + key + '/rating').set(95);
            alert("রেটিং দেওয়ার জন্য ধন্যবাদ!");
        }

        function deletePost(key) {
            if(confirm("ডিলিট করতে চান?")) database.ref('donors/' + key).remove();
        }

        function updateUI() {
            if(myKey) {
                document.getElementById('formTitle').innerHTML = "<i class='fas fa-user-cog'></i> প্রোফাইল এডিট করুন";
                document.getElementById('saveBtn').innerHTML = "<i class='fas fa-upload'></i> পোস্ট আপডেট করুন";
                database.ref('donors/'+myKey).once('value', s => {
                    const d = s.val();
                    if(d) {
                        document.getElementById('inName').value = d.name || "";
                        document.getElementById('inBlood').value = d.blood || "";
                        document.getElementById('inType').value = d.type || "";
                        document.getElementById('inLoc').value = d.loc || "";
                        document.getElementById('inPhone').value = d.phone || "";
                        document.getElementById('inWeight').value = d.weight || "";
                        document.getElementById('inLast').value = d.last || "";
                        document.getElementById('inTimes').value = d.times || "";
                        document.getElementById('inCanDonate').value = d.canDonate || "হ্যাঁ";
                        document.getElementById('inBio').value = d.bio || "";
                        document.getElementById('inFb').value = d.fb || "";
                        document.getElementById('inWa').value = d.wa || "";
                    }
                });
            }
        }

        function showFeed() {
            document.getElementById('regPage').style.display = 'none';
            document.getElementById('statsArea').style.display = 'grid'; // স্ট্যাটাস বক্স দেখাবে
            document.getElementById('filterTabs').style.display = 'flex';
            document.getElementById('donorList').style.display = 'block';
            document.getElementById('navHome').classList.add('active');
            document.getElementById('navReg').classList.remove('active');
            loadDonors();
        }

        function showReg() {
            document.getElementById('regPage').style.display = 'block';
            document.getElementById('statsArea').style.display = 'none';
            document.getElementById('filterTabs').style.display = 'none';
            document.getElementById('donorList').style.display = 'none';
            document.getElementById('navReg').classList.add('active');
            document.getElementById('navHome').classList.remove('active');
            updateUI();
        }

        window.onload = () => { if(myKey) showFeed(); else loadDonors(); };
    </script>
</body>
</html>
